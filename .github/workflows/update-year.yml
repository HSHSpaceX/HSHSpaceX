name: Update Year
on:
  schedule:
    - cron: '0 0 1 * *'   # 每月 1 号跑一次
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update year
        run: |
          YEAR=$(date +%Y)
          sed -i "s/© [0-9]\{4\}/© $YEAR/g" README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add README.md && git commit -m "chore: update year" && git push)

      - name: Keep alive
        uses: liskin/gh-workflow-keepalive@v1
